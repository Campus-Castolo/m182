############################################
# Interfaces & listening
############################################

# Explicitly listen only on the container's IP and localhost.
# 192.168.10.40 must match the static IP in docker-compose.
listen-address=192.168.10.40,127.0.0.1

# Bind only to interfaces with those addresses.
bind-interfaces

# Refuse queries not coming from directly connected subnets.
# (Prevents being used as an open resolver even if exposed.)
local-service

############################################
# No DHCP / TFTP / extras
############################################

# Make it DNS-only.
no-dhcp-interface=*
# (No dhcp-range, no PXE, no TFTP defined.)

############################################
# Don’t trust host’s /etc/hosts or resolv.conf
############################################

no-hosts       # don’t leak container /etc/hosts into DNS
no-resolv      # do NOT read /etc/resolv.conf
no-poll        # don’t watch resolv.conf for changes

############################################
# Upstream resolvers (plaintext, but trusted)
############################################

# Privacy-friendly-ish resolvers. Change if you prefer Quad9, etc.
server=1.1.1.1
server=1.0.0.1

# If you *later* put a DoT/DoH proxy (stubby, unbound, dnscrypt, etc.)
# in front of this, point these to that local proxy instead. :contentReference[oaicite:1]{index=1}

############################################
# Safety & privacy on queries
############################################

# Never forward plain names (no dot).
domain-needed

# Don’t forward RFC1918 reverse lookups upstream.
bogus-priv

# Protect against DNS rebinding attacks: block upstream answers which
# map public names to private IPs.
stop-dns-rebind

# Allow your internal lab domain to legitimately resolve to private IPs.
rebind-domain-ok=/lab.local/

# Don’t be a public name server for anything – only your LAN should ever see this.
# (local-service already enforces that; this just reinforces behaviour.)

############################################
# Caching behaviour
############################################

# Reasonable cache for a small lab; DNSSEC requires cache not too small. :contentReference[oaicite:2]{index=2}
cache-size=1000

# TTL bounds (seconds).
min-cache-ttl=60
max-cache-ttl=86400

# Avoid large fragmented DNS packets (helps security & reliability).
edns-packet-max=1232

############################################
# Local lab zone: lab.local
############################################

# Declare lab.local as your DNS domain and keep it local.
domain=lab.local
local=/lab.local/

# Static host records (authoritative for these names).
host-record=client.lab.local,192.168.10.50
host-record=dns.lab.local,192.168.10.40
host-record=smtp.lab.local,192.168.10.30
host-record=html.lab.local,192.168.10.20
host-record=ftp.lab.local,192.168.10.10

############################################
# DNSSEC validation (integrity)
############################################
# Requires dnsmasq built with HAVE_DNSSEC and trust anchors configured. :contentReference[oaicite:3]{index=3}

# Enable DNSSEC validation.
dnssec

# Also verify that unsigned replies are truly unsigned (safer, but a tad more strict).
dnssec-check-unsigned

# Root trust anchors (current IANA root KSK DS records).
# Keep these updated over time from IANA/thekelleys.org.uk. :contentReference[oaicite:4]{index=4}
trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D
trust-anchor=.,38696,8,2,683D2D0ACB8C9B712A1948B27F741219298D0A450D612C483AF444A4C0FB2B16

############################################
# Logging (minimal, privacy-aware)
############################################

# Log to stderr (docker logs) instead of to a file in the container.
log-facility=-

# Do NOT log queries by default – better for privacy.
# Uncomment for debugging (but remember this leaks DNS history).
# log-queries

############################################
# Misc additional paranoia
############################################

# Don’t hand out DNS info via DHCP (we’re not running DHCP anyway,
# but this prevents accidental behaviour if config changes later).
dhcp-option=option:dns-server,0.0.0.0
